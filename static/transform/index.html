<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Transform has been removed — meso.utilities</title>
  <!-- Tombstone for the retired Text Transform tool. The tool itself is gone;
       this page exists only so an old bookmark or link lands on the hub instead
       of a 404 (GitHub Pages has no redirect layer, so the redirect has to be a
       page). Deliberately standalone — no shared CSS or scripts for something
       that is on screen for one blink — and noindex, so the old URL drops out of
       search results rather than being indexed as a real page. -->
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0; url=../" />
  <link rel="canonical" href="../" />
  <style>
    :root {
      color-scheme: dark light;
    }

    body {
      font: 16px/1.5 system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <p>Text Transform has been removed. Taking you to <a href="../">meso.utilities</a>…</p>
</body>
</html>
